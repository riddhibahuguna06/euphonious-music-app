<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euphonious</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Euphonious</h1>
        <p id="user-name">Welcome!</p>
    </header>

    <main>

        <section>
            <h2>Your Playlists</h2>

            <div id="playlist-container">
                <!-- JavaScript will add playlists here -->
            </div>

            <button id="create-playlist">+ Create Playlist</button>
        </section>

        <section>
            <h2>Songs</h2>

            <div id="songs-container">
                <!-- JavaScript will add songs here -->
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
